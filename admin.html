<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1455c0">
  <title>Área administrativa | Yeti Gelinhos Gourmet</title>
  <style>
    :root{--ink:#10234f;--muted:#637894;--blue:#1455c0;--line:#dce9f8;--ice:#f2f8ff}
    *{box-sizing:border-box}body{margin:0;background:var(--ice);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}.top{max-width:860px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;color:var(--ink);text-decoration:none}.back{color:var(--blue);font-weight:700}
    main{max-width:860px;margin:36px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 40px #16418415}.card h1{font:32px Georgia,serif;margin:0 0 5px}.help,.muted{color:var(--muted)}.help{margin:0 0 20px}.form{display:grid;gap:14px;max-width:440px}.form label,.row label{font-size:13px;font-weight:700}.form input,.row input{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf4fc;color:var(--ink)}.button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;color:var(--muted);font-size:14px}.status.error{color:#a33d4b}.status.success{color:#267849}
    .menu-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.rows{display:grid;gap:10px;margin-top:18px}.row{display:grid;grid-template-columns:minmax(180px,1fr) 130px 130px 130px;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px}.row strong{font-size:14px}.row label{color:var(--muted);font-weight:600}.row input{padding:9px}.hidden{display:none!important}
    @media(max-width:560px){main{margin:22px auto}.card{padding:18px}.row{grid-template-columns:1fr 1fr}.row label:first-child{grid-column:1/-1}}
  </style>
</head>
<body>
  <header><div class="top"><a class="brand" href="./">Yeti Gelinhos Gourmet · Administração</a><a class="back" href="./">Voltar à loja</a></div></header>
  <main>
    <section class="card" id="login-panel">
      <h1>Acesso administrativo</h1>
      <p class="help">Entre com o e-mail e a senha cadastrados para a administração do cardápio.</p>
      <form class="form" id="login-form">
        <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" id="login-button" type="submit">Entrar</button>
      </form>
      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </section>
    <section class="card hidden" id="menu-panel">
      <div class="menu-head"><div><h1>Gerenciar sabores</h1><p class="help">As alterações são compartilhadas com todos os clientes.</p></div><button class="button secondary" id="logout-button" type="button">Sair</button></div>
      <div class="rows" id="product-rows"></div>
      <div class="actions"><button class="button primary" id="save-button" type="button">Salvar cardápio</button></div>
      <p class="status" id="menu-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
